name: Deny
on:
  workflow_dispatch:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    uses: mozilla/actions/.github/workflows/deny.yml@42622e57e54d96514373f5234c0220b014e64740 # v3.1.1
