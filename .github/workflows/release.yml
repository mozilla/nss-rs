name: Release
on: # zizmor: ignore[concurrency-limits] - release events are inherently serialised
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Update major version tag
    uses: mozilla/actions/.github/workflows/release.yml@96ce92daf6ecffbe02728649f25f32a15eba543e # v2.0.2
    permissions:
      contents: write # Required to update the major version tag
    with:
      tag: ${{ github.event.release.tag_name }}
