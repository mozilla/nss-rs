name: Release
on: # zizmor: ignore[concurrency-limits] - release events are inherently serialised
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Update major version tag
    uses: mozilla/actions/.github/workflows/release.yml@80429d96b44ae13c8cfe2a2dbec978ffc31c3720 # v3.3.0
    permissions:
      contents: write # Required to update the major version tag
    with:
      tag: ${{ github.event.release.tag_name }}
