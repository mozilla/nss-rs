name: Check semver
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver:
    name: Check semver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::No tags found; cannot determine semver baseline"
            exit 1
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - uses: mozilla/actions/rust@bf3fb2950385cdbf80d0248db988d39096963755 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: nss-meta
        uses: ./.github/actions/nss-metadata

      - uses: mozilla/actions/nss@bf3fb2950385cdbf80d0248db988d39096963755 # v2.0.0
        with:
          minimum-version: ${{ steps.nss-meta.outputs.min-version }}
          sha256: ${{ steps.nss-meta.outputs.sha256 }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla/actions/semver@bf3fb2950385cdbf80d0248db988d39096963755 # v2.0.0
        with:
          base-ref: ${{ steps.tag.outputs.ref }}
