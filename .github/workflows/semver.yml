name: Check semver
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver:
    name: Check semver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::No tags found; cannot determine semver baseline"
            exit 1
          fi
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - uses: mozilla/actions/rust@96ce92daf6ecffbe02728649f25f32a15eba543e # v2.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false

      - id: install-nss
        uses: ./install-nss
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla/actions/semver@96ce92daf6ecffbe02728649f25f32a15eba543e # v2.0.2
        with:
          base-ref: ${{ steps.tag.outputs.ref }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.ref }}
          path: baseline

      - id: nss-meta-baseline
        uses: ./.github/actions/nss-metadata
        continue-on-error: true # the baseline tag may predate [package.metadata.nss]
        with:
          working-directory: baseline

      - name: Ensure crate version is bumped if the NSS floor changed
        if: steps.nss-meta-baseline.outcome == 'success'
        env:
          BASE_MIN: ${{ steps.nss-meta-baseline.outputs.min-version }}
          HEAD_MIN: ${{ steps.install-nss.outputs.min-version }}
          BASE_VERSION: ${{ steps.nss-meta-baseline.outputs.crate-version }}
          HEAD_VERSION: ${{ steps.install-nss.outputs.crate-version }}
        run: |
          echo "NSS floor: $BASE_MIN -> $HEAD_MIN"
          echo "Crate version: $BASE_VERSION -> $HEAD_VERSION"
          if [ "$BASE_MIN" != "$HEAD_MIN" ] && [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::NSS floor bumped ($BASE_MIN -> $HEAD_MIN) without a crate version bump. Bump [package].version in Cargo.toml."
            exit 1
          fi
