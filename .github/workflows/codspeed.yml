name: CodSpeed
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch: # For CodSpeed backfills.

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.bench.name }}${{ matrix.bench.features && format('-{0}', matrix.bench.features) }} (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: &matrix
        mode: [simulation, memory]
        bench:
          - { name: crypto }
          - { name: handshake }
          - { name: record_protection }
          # blapi only changes record protection, so only that target is rerun.
          - { name: record_protection, features: blapi }
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &rust
        uses: mozilla/actions/rust@32d84c77ea1bb513afbd253f94f67ae138b7d8be # v2.0.10
        with:
          version: stable
          tools: cargo-codspeed
          token: ${{ secrets.GITHUB_TOKEN }}
          rust-cache: false

      - uses: $/install-nss
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the benchmark target
        env:
          BENCH: ${{ matrix.bench.name }}
          FEATURES: ${{ matrix.bench.features }}
          MODE: ${{ matrix.mode }}
        run: cargo codspeed build --locked --features "bench${FEATURES:+,$FEATURES}" --bench "$BENCH" --measurement-mode "$MODE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: &artifact codspeed-build-${{ matrix.bench.name }}${{ matrix.bench.features && format('-{0}', matrix.bench.features) }}-${{ matrix.mode }}
          path: | # `cargo codspeed run` looks under the target directory.
            target/codspeed
            dist/Release/lib/*.so
          retention-days: 1

  benchmarks:
    name: Run ${{ matrix.bench.name }}${{ matrix.bench.features && format('-{0}', matrix.bench.features) }} (${{ matrix.mode }})
    runs-on: codspeed-macro-x86-ryzen-9950x-ubuntu-24-04 # zizmor: ignore[self-hosted-runner]
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: *matrix
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # For CodSpeed OIDC authentication.
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/dist/Release/lib
      TEST_FIXTURE_DB: ${{ github.workspace }}/test-fixture/db # The built-in path is the build runner's.
    steps:
      - *checkout

      # The runner image ships a toolchain with a different profile, and reconciling
      # against it hits an EXDEV rename bug in rustup, so install into a job-local home.
      - name: Use a fresh Rust toolchain home
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
          } >> "$GITHUB_ENV"

      - *rust

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: *artifact

      - run: find target/codspeed -type f -exec chmod +x {} + # Artifacts drop the executable bit.

      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run
