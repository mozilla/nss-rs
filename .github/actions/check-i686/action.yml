name: "i686 checks"
description: "Cross-compile nss-rs and its tests for 32-bit x86 Linux (i686-unknown-linux-gnu)."

inputs:
  working-directory:
    description: "Working directory."
    default: "."
  github-token:
    description: "A GitHub PAT"
    required: true

runs:
  using: composite
  steps:
    - name: Install 32-bit host toolchain
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        if [ -z "$APT_UPDATED" ]; then
          sudo apt-get update
          echo "APT_UPDATED=1" >> "$GITHUB_ENV"
        fi
        sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib

    - uses: mozilla/actions/rust@4f515786a131dedc8913cf64640f35a144ea4d0f # v2.0.9
      with:
        version: stable
        targets: i686-unknown-linux-gnu
        tools: cargo-hack
        token: ${{ inputs.github-token }}
        rust-cache: false

    - uses: $/install-nss
      with:
        working-directory: ${{ inputs.working-directory }}
        target: i686-unknown-linux-gnu
        token: ${{ inputs.github-token }}

    - name: Compile tests (no-run)
      shell: bash
      env:
        WD: ${{ inputs.working-directory }}
      run: cd "$WD" && cargo hack --feature-powerset --exclude-features gecko,blapi test --no-run --target i686-unknown-linux-gnu
