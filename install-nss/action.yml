name: "Install NSS for nss-rs"
description: >
  Read the NSS version and release tarball SHA256 required by nss-rs via
  nss-metadata, then install that NSS via mozilla/actions/nss.

inputs:
  working-directory:
    description: "Directory containing the Cargo.toml to read."
    default: "."
  target:
    description: "Target for cross-compilation."
    default: ""
  token:
    description: "A GitHub PAT; used to avoid rate limits when fetching build scripts."
    required: false

runs:
  using: composite
  steps:
    - id: meta
      uses: ./.github/actions/nss-metadata
      with:
        working-directory: ${{ inputs.working-directory }}

    - uses: mozilla/actions/nss@bf3fb2950385cdbf80d0248db988d39096963755 # v2.0.0
      with:
        minimum-version: ${{ steps.meta.outputs.min-version }}
        sha256: ${{ steps.meta.outputs.sha256 }}
        target: ${{ inputs.target }}
        token: ${{ inputs.token }}
